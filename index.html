<head>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
}

body {
    background: linear-gradient(135deg,#eef4ff,#ffffff);
    user-select: none;
}

/* Navbar */
.navbar {
    display: flex;
    justify-content: space-between;
    padding: 15px 20px;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(15px);
    position: fixed;
    width: 100%;
    z-index: 1000;
}

.title {
    font-weight: bold;
    font-size: 18px;
    color: #1e3799;
}

.menu-btn {
    font-size: 22px;
    cursor: pointer;
}

/* Sidebar */
.sidebar {
    position: fixed;
    right: -320px;
    top: 0;
    width: 300px;
    height: 100%;
    background: white;
    padding: 20px;
    transition: 0.3s;
    z-index: 2000;
    overflow-y: auto;
}

.sidebar.active {
    right: 0;
}

.sidebar li {
    list-style: none;
    padding: 10px;
    margin: 8px 0;
    background: #f1f5ff;
    border-radius: 10px;
    cursor: pointer;
}

.sidebar li:hover {
    background: #d6e0ff;
}

/* Content */
.container {
    padding: 100px 20px;
}

.card {
    padding: 20px;
    border-radius: 15px;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(15px);
}

/* Q&A BOX */
.qa {
    margin-bottom: 15px;
    padding: 12px;
    border-left: 5px solid #4a69bd;
    background: #f7f9ff;
    border-radius: 10px;
}

/* Popup */
.popup {
    display: none;
    position: fixed;
    z-index: 3000;
    left: 0; top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    justify-content: center;
    align-items: center;
}

.popup-content {
    background: white;
    padding: 20px;
    width: 90%;
    max-width: 700px;
    border-radius: 15px;
    max-height: 80vh;
    overflow-y: auto;
}

.close {
    float: right;
    cursor: pointer;
    font-size: 20px;
}

/* Gallery */
.gallery img {
    width: 100%;
    border-radius: 10px;
    margin-top: 10px;
    cursor: pointer;
}

    /* ===== ADD-ON: GLASSY GALLERY CARDS ===== */
.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    margin-top: 15px;
}

.gallery-item {
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 10px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.1);
    transition: 0.25s ease;
}

.gallery-item:hover {
    transform: translateY(-4px);
}

.gallery-item img {
    width: 100%;
    border-radius: 15px;
}

.gallery-actions {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
}

/* Rounded modern buttons */
.view-btn, .visit-btn {
    border: none;
    padding: 8px 12px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    color: #fff;
}

.view-btn {
    background: linear-gradient(45deg,#4a69bd,#6a89cc);
}

.visit-btn {
    background: linear-gradient(45deg,#38ada9,#78e08f);
}
</style>

<script>
function toggleMenu(){
    document.getElementById("sidebar").classList.toggle("active");
}

function openTab(tab){
let data = "";

if(tab === "fundamentals"){
data = `
<h3>SOC Fundamentals & Thinking</h3>

<div class="qa">
<b>Q1: What is a Security Operations Center (SOC)?</b>
<p>A Security Operations Center (SOC) is a centralized unit that monitors, detects, and responds to cybersecurity threats in real time.
It acts like a digital control room where analysts keep watch over systems, networks, and endpoints.
SOC teams use tools like SIEM to analyze logs and identify suspicious activities.
The main goal is to prevent attacks or minimize damage quickly.
Think of it as the frontline defense team of an organization’s cybersecurity.</p>
</div>

<div class="qa">
<b>Q2: Who is a SOC Analyst Level 1?</b>
<p>A SOC L1 Analyst is the first responder in cybersecurity monitoring.
They monitor alerts, analyze logs, and identify potential threats using security tools.
Their job is to triage alerts—separating real threats from false positives.
They escalate serious incidents to higher-level analysts (L2/L3).
This role builds strong fundamentals in networking, logs, and security thinking.</p>
</div>

<div class="qa">
<b>Q3: What is SIEM?</b>
<p>SIEM stands for Security Information and Event Management.
It collects logs from different systems like servers, firewalls, and endpoints.
Then it analyzes these logs to detect suspicious patterns or attacks.
SIEM tools generate alerts when something unusual happens.
Examples include Splunk, IBM QRadar, and Microsoft Sentinel.</p>
</div>

<div class="qa">
<b>Q4: What is a Security Incident?</b>
<p>A security incident is any event that threatens the confidentiality, integrity, or availability of data.
Examples include malware infection, unauthorized access, or data breaches.
Not all alerts are incidents—only confirmed threats are incidents.
SOC analysts investigate alerts to determine if they are real incidents.
Proper incident handling reduces damage and prevents future attacks.</p>
</div>

<div class="qa">
<b>Q5: What is a False Positive?</b>
<p>A false positive is when a security tool flags normal activity as malicious.
For example, a legitimate login may be marked as suspicious.
SOC analysts must carefully analyze alerts to avoid unnecessary panic.
Too many false positives waste time and resources.
Good analysts learn to filter noise and focus on real threats.</p>
</div>

<div class="qa">
<b>Q6: What is a True Positive?</b>
<p>A true positive is when a security alert correctly identifies a real threat.
For example, detecting malware or unauthorized login successfully.
These alerts require immediate investigation and response.
SOC analysts validate and escalate true positives quickly.
Accurate detection is critical for strong security operations.</p>
</div>

<div class="qa">
<b>Q7: What is Log Analysis?</b>
<p>Log analysis is the process of reviewing system-generated records (logs).
Logs contain details like login attempts, errors, and system activities.
SOC analysts use logs to detect suspicious behavior.
For example, multiple failed logins may indicate a brute-force attack.
Understanding logs is a core skill for SOC Level 1.</p>
</div>

<div class="qa">
<b>Q8: What is Alert?</b>
<p>An alert is a notification generated by security tools when suspicious activity is detected.
Alerts can come from SIEM, IDS, antivirus, or firewalls.
Not every alert is dangerous—it must be investigated.
SOC analysts review alerts and decide their severity.
Alerts are the starting point of every investigation.</p>
</div>

<div class="qa">
<b>Q9: What is Threat Intelligence?</b>
<p>Threat intelligence is information about potential or existing cyber threats.
It includes data like malicious IPs, domains, and attack techniques.
SOC teams use it to detect and prevent attacks faster.
It helps analysts understand attacker behavior and trends.
Sources include open-source intelligence (OSINT) and paid feeds..</p>
</div>

<div class="qa">
<b>Q10: What is Ndicator of Compromise IOC?</b>
<p>IOC is evidence that shows a system may be compromised.
Examples include suspicious IP addresses, file hashes, or domains.
SOC analysts use IOCs to detect attacks in systems.
They compare logs with known IOCs to find threats.
IOCs help in quick identification of malicious activity.</p>
</div>

<div class="qa">
<b>Q11: What is Malware?</b>
<p>Malware is malicious software designed to harm systems.
Types include viruses, worms, ransomware, and trojans.
It can steal data, damage systems, or give attackers access.
SOC analysts detect malware using tools and logs.
Preventing malware is a key part of cybersecurity.</p>
</div>

<div class="qa">
<b>Q12: What is Phishing?</b>
<p>Phishing is a social engineering attack where attackers trick users into sharing sensitive data.
Usually done through fake emails or websites.
Attackers pretend to be trusted sources like banks or companies.
Users may unknowingly provide passwords or personal details.
SOC teams monitor and respond to phishing campaigns.</p>
</div>

<div class="qa">
<b>Q13: What is Firewall?</b>
<p>A firewall is a security device that controls network traffic.
It allows or blocks traffic based on security rules.
Firewalls protect internal networks from external threats.
They can be hardware-based or software-based.
SOC analysts monitor firewall logs for suspicious activity.</p>
</div>

<div class="qa">
<b>Q14: What is IDS & IPS?</b>
<p>IDS stands for Intrusion Detection System, and IPS stands for Intrusion Prevention System.
IDS detects suspicious activity and alerts the SOC team.
IPS not only detects but also blocks the threat automatically.
Both systems help protect networks from attacks.
They are essential tools in a SOC environment.</p>
</div>

<div class="qa">
<b>Q15: What is CIA Triad?</b>
<p>The CIA Triad stands for Confidentiality, Integrity, and Availability.
Confidentiality ensures data is accessible only to authorized users.
Integrity ensures data is accurate and not altered.
Availability ensures systems and data are accessible when needed.
This is the foundation of all cybersecurity principles.</p>
</div>
`;
}

if(tab === "networking"){
data = `<div class="qa"><b>Q: TCP Handshake?</b><p>SYN → SYN-ACK → ACK</p></div>`;
}

if(tab === "siem"){
data = `<div class="qa"><b>Q: SIEM?</b><p>Log monitoring tool.</p></div>`;

}

if(tab === "edr"){
data = `<div class="qa"><b>Q: EDR?</b><p>Endpoint security tool.</p></div>`;
}

if(tab === "attacks"){
data = `<div class="qa"><b>Q: Phishing?</b><p>Social engineering attack.</p></div>`;

document.getElementById("popupData").innerHTML = data;
document.getElementById("popup").style.display = "flex";
}

if(e.ctrlKey && (e.key === 'c' || e.key === 'u')){
e.preventDefault();
}
