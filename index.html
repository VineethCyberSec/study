<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOC L1 Cyber Hub</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
}

body {
    background: linear-gradient(135deg,#eef4ff,#ffffff);
}

/* Navbar */
.navbar {
    display: flex;
    justify-content: space-between;
    padding: 15px 20px;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(15px);
    position: fixed;
    width: 100%;
    z-index: 1000;
}

.title {
    font-weight: bold;
    color: #1e3799;
}

.menu-btn {
    font-size: 22px;
    cursor: pointer;
}

/* Sidebar FIX */
.sidebar {
    position: fixed;
    right: -320px;
    top: 0;
    width: 300px;
    height: 100%;
    background: white;
    padding: 20px;
    transition: 0.3s;
    z-index: 2000; /* FIX */
    overflow-y: auto;
}

.sidebar.active {
    right: 0;
}

.sidebar li {
    list-style: none;
    padding: 10px;
    margin: 8px 0;
    background: #f1f5ff;
    border-radius: 10px;
    cursor: pointer;
}

.sidebar li:hover {
    background: #d6e0ff;
}

/* Content */
.container {
    padding: 100px 20px;
}

.card {
    padding: 20px;
    border-radius: 15px;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(15px);
}

/* Popup */
.popup {
    display: none;
    position: fixed;
    z-index: 3000;
    left: 0; top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    justify-content: center;
    align-items: center;
}

.popup-content {
    background: white;
    padding: 20px;
    width: 90%;
    max-width: 600px;
    border-radius: 15px;
    max-height: 80vh;
    overflow-y: auto;
}

.close {
    float: right;
    cursor: pointer;
    font-size: 20px;
}

/* Disable copy */
body {
    user-select: none;
}
</style>
</head>

<body oncontextmenu="return false">

<div class="navbar">
    <div class="title">SOC L1 Training</div>
    <div class="menu-btn" onclick="toggleMenu()">☰</div>
</div>

<div class="sidebar" id="sidebar">
<ul>
<li onclick="openTab('fundamentals')">SOC Fundamentals</li>
<li onclick="openTab('networking')">Networking</li>
<li onclick="openTab('siem')">SIEM</li>
<li onclick="openTab('email')">Email Security</li>
<li onclick="openTab('edr')">EDR</li>
<li onclick="openTab('attacks')">Advanced Attacks</li>
</ul>
</div>

<div class="container">
<div class="card">
<h2>Welcome</h2>
<p>Click menu → choose topic → popup Q&A appears.</p>
</div>
</div>

<!-- POPUP -->
<div class="popup" id="popup">
<div class="popup-content">
<span class="close" onclick="closePopup()">×</span>
<div id="popupData"></div>
</div>
</div>

<script>
function toggleMenu(){
    document.getElementById("sidebar").classList.toggle("active");
}

function openTab(tab){
    let data = "";

    if(tab === "fundamentals"){
        data = `
        <h3>SOC Fundamentals</h3>
        <b>Q: What is SOC?</b>
        <p>A Security Operations Center monitors, detects, and responds to threats 24/7.</p>
        `;
    }

    if(tab === "networking"){
        data = `
        <h3>Networking</h3>
        <b>Q: What is TCP 3-way handshake?</b>
        <p>SYN → SYN-ACK → ACK. It establishes connection between client and server.</p>
        `;
    }

    if(tab === "siem"){
        data = `
        <h3>SIEM</h3>
        <b>Q: What is SIEM?</b>
        <p>Security Information and Event Management collects logs and detects threats.</p>
        `;
    }

    if(tab === "email"){
        data = `
        <h3>Email Security</h3>
        <b>Q: What is SPF?</b>
        <p>SPF verifies sender IP to prevent spoofing.</p>
        `;
    }

    if(tab === "edr"){
        data = `
        <h3>EDR</h3>
        <b>Q: What is EDR?</b>
        <p>Endpoint Detection and Response monitors endpoints for threats.</p>
        `;
    }

    if(tab === "attacks"){
        data = `
        <h3>Advanced Attacks</h3>
        <b>Q: What is phishing?</b>
        <p>Attackers trick users into revealing credentials.</p>
        `;
    }

    document.getElementById("popupData").innerHTML = data;
    document.getElementById("popup").style.display = "flex";
}

function closePopup(){
    document.getElementById("popup").style.display = "none";
}

/* Disable shortcuts */
document.addEventListener("keydown", function(e){
    if(e.ctrlKey && (e.key === 'c' || e.key === 'u')){
        e.preventDefault();
    }
});
</script>

</body>
</html>
